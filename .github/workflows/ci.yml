name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm ci

      # apps/web imports @memo/sdk's compiled dist/, which isn't committed
      # (gitignored build output) - build it before anything that resolves
      # the package, or typecheck/test fail with a bare "cannot find module".
      - run: npm run build -w packages/sdk

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test
